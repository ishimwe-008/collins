<body>   
 <div id="a"><H2> APEBU NYAMATA TECHINICAL SECONDARY SCHOOL</H2>
            <pre><a href="index.html">main</a>    <a href="home.html">home</a>    <a href="aboutus.html">aboutus</a>    <a href="academics.html">academics</a>    <a href="services.html">services</a>    <a href="admission.html" style="background-color:brown ;">admission</a>    <a href="gallery.html">gallery</a>    <a href="contactus.html">contactus</a></pre></div><div id="b">    
    <div class="main-container">
        <div class="admission-wrapper">
            <div class="card" id="mainCard">
                <div class="card-header">
                    <h1>APEBU NYAMATA TSS</h1>
                    <p>ADMISSION FORM</p>
                </div>

                <form id="admissionForm">
                    <div class="input-field">
                        <label>YOUR NAME</label>
                        <input type="text" id="stuName" placeholder="Full Name" required>
                    </div>

                    <div class="input-field">
                        <label> YOUR EMAIL</label>
                        <input type="email" id="stuEmail" placeholder="example@mail.com" required>
                    </div>
                    <div class="input-field">
                        <label>TRADE</label>
                        <select id="stuLevel" required>
                            <option value="">CHOOSE YOUR TRADE</option>
                            <option value="SOFTWARE DEVELOPMENT">SOFTWARE DEVELOPMENT</option>
                            <option value="MULTIMEDIA PRODUCTION">MULTIMEDIA PRODUCTION</option>
                            <option value="BUILDING CONSTRUCTION">BUILDING CONSTRUCTION</option>
                            <option value="TOURISM">TOURISM</option>
                            <option value="FOOD BEVERAGE OPARATION">FOOD BEVERAGE OPARETION</option>
                        </select>
                    </div><button type="submit" class="submit-btn">SUBMIT ADMISSION</button></form></div>
            <div id="successView" class="success-box" style="display: none;">
                <div class="icon">✓</div>
                <h3>SUCCESSFUL!</h3>
                <p id="resultText" style="margin-top: 15px; line-height: 1.6;"></p>
                <button onclick="location.reload()" class="E">Back to Form</button>
            </div>
        </div>
    </div>

    <script>
        const myForm = document.getElementById('admissionForm');
        const mainCard = document.getElementById('mainCard');
        const successView = document.getElementById('successView');
        const resultText = document.getElementById('resultText');

        myForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('stuName').value;
            const level = document.getElementById('stuLevel').value;

            mainCard.style.display = 'none';
            successView.style.display = 'block';
            
            resultText.innerHTML = "thank you <b>" + name + "</b> to ask for learning <b>" + level + "</b> in APEBU nyamata TSS.";
        });
    </script>
